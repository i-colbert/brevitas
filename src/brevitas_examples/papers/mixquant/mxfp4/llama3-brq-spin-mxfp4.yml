block_rotation_dim: 32  # block size of rotation
dataset_eval_split: test
dtype: bfloat16
eval: true
few_shot_eval: lighteval
few_shot_override_batch_size: 128
few_shot_tasks:
- arc:challenge|0
- arc:easy|0
- winogrande|0
- hellaswag_lm_eval|0
- piqa_lm_eval|0
few_shot_zeroshot: true
gptq: true
gpxq_act_order: true
gpxq_block_name: model.layers
gpxq_use_quant_activations: true
gpxq_buffer_device: same
replace_rmsnorm: true
rotation: fused_no_fx  # rotations are merged
rotation_sdpa_regions: true
rotation_mode: had
rotation_orphan_sink: true
seed: 42
model: meta-llama/Llama-3.2-1B-Instruct
# input quantization
input_bit_width: 4
input_group_size: 32
input_param_method: stats
input_quant_format: float_ocp_e2m1
input_quant_granularity: per_group
input_quant_type: sym
input_scale_precision: po2_scale
input_scale_type: dynamic
# weight quantization
weight_bit_width: 4
weight_group_size: 32
weight_param_method: mse
weight_quant_format: float_ocp_e2m1
weight_quant_granularity: per_group
weight_quant_type: sym
weight_scale_precision: po2_scale
# shared scale settings
scale_rounding_func_type: floor
# using hyperparameters similar to original SpinQuant paper
optimize_rotations: true
nsamples_rot_calibration: 800
learning_rate: 1.5
weight_decay: 0.0
lr_scheduler_type: cosine
max_steps: 100
save_safetensors: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
logging_steps: 10
log_on_each_node: false
torch_empty_cache_steps: 1
gradient_checkpointing: true
