block_rotation_dim: 32  # block size of rotation
dataset_eval_split: test
dtype: bfloat16
eval: true
few_shot_eval: lighteval
few_shot_override_batch_size: 128
few_shot_tasks:
- arc:challenge|0
- arc:easy|0
- winogrande|0
- hellaswag_lm_eval|0
- piqa_lm_eval|0
few_shot_zeroshot: true
gptq: true
gpxq_act_order: true  # quantizing in descending order of diagonal
gpxq_block_name: model.layers
gpxq_use_quant_activations: true  # using rotated and quantized activations
gpxq_buffer_device: same
input_bit_width: 4
input_quant_granularity: per_row
input_scale_type: dynamic
replace_rmsnorm: true
rotation: fused_no_fx  # rotations are merged
rotation_sdpa_regions: true
rotation_mode: had
rotation_orphan_sink: true
seed: 42
model: meta-llama/Llama-3.2-1B-Instruct
weight_bit_width: 4
weight_param_method: mse  # calibrate weight scales based on MSE
weight_quant_granularity: per_channel
weight_quant_type: sym
